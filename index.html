<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 7공동체 국내선교</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5668d9;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app-container flex flex-col h-screen overflow-hidden">
        
        <header class="bg-[#5668d9] text-white pt-4 sticky top-0 z-10 shadow-md shrink-0">
            <div class="px-4">
                <div class="flex items-center gap-3 mb-4">
                    <h1 class="text-xl font-bold tracking-tight">국내선교 참가 명단</h1>
                </div>
                
                <div class="flex items-center gap-2 mb-4">
                    <div class="relative flex-1">
                        <input type="text" id="searchInput" placeholder="이름 또는 조 검색..." class="w-full pl-10 pr-4 py-2.5 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-300 shadow-sm text-sm" onkeyup="filterList()">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    
                    <div class="bg-[#eec04b] text-[#5c4009] px-3 py-2.5 rounded-xl text-sm font-bold shadow-sm whitespace-nowrap flex items-center justify-center gap-1.5">
                        <span id="total-count" class="leading-none mt-[1px]">총 0명</span>
                    </div>

                    <button onclick="fetchData()" class="bg-[#788bf3] hover:bg-blue-400 text-white p-2.5 rounded-xl shadow-sm transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </div>

            <div class="flex px-2 pt-2 bg-black/5">
                <button id="tab-전체" class="flex-1 py-2.5 text-sm font-bold bg-white text-[#5668d9] rounded-t-lg transition shadow-sm" onclick="setTab('전체')">전체</button>
                <button id="tab-유치부" class="flex-1 py-2.5 text-sm font-bold text-white/80 hover:text-white transition" onclick="setTab('유치부')">유치부</button>
                <button id="tab-어린이부" class="flex-1 py-2.5 text-sm font-bold text-white/80 hover:text-white transition" onclick="setTab('어린이부')">어린이부</button>
            </div>
        </header>

        <main class="flex-1 p-4 overflow-y-auto bg-gray-50 pb-10" id="app-content">
            <div id="loading" class="text-center text-gray-500 mt-10"><div class="loader"></div><p>데이터 불러오는 중...</p></div>
            <div id="error-message" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm text-center"></div>
            <div id="data-list" class="flex flex-col gap-3"></div>
        </main>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRH_Fs1olCu5C1oEiC88d6FekDDF0aNtG21_ex5sC7Y4JrGADra8HkOwwvj558rM7OUZgQMC7PpsORQ/pub?gid=27496411&single=true&output=csv"; 
        let participantsData = [];
        let currentCategory = '전체'; 

        function fetchData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false,
                complete: (results) => processData(results.data)
            });
        }

        function processData(rawData) {
            let headerIndex = rawData.findIndex(row => row.some(cell => cell?.includes("이름")));
            const headers = rawData[headerIndex];
            participantsData = rawData.slice(headerIndex + 1).map(row => {
                let obj = {};
                headers.forEach((h, i) => obj[h?.trim()] = row[i]?.trim());
                return obj;
            }).filter(p => p["이름"]);
            filterList();
        }

        function setTab(cat) {
            currentCategory = cat;
            ['전체', '유치부', '어린이부'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                el.className = (t === cat) ? "flex-1 py-2.5 text-sm font-bold bg-white text-[#5668d9] rounded-t-lg shadow-sm" : "flex-1 py-2.5 text-sm font-bold text-white/80";
            });
            filterList();
        }

        function filterList() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = participantsData.filter(p => 
                (p["이름"]?.toLowerCase().includes(query) || p["조 편성"]?.toLowerCase().includes(query)) &&
                (currentCategory === '전체' || (p["조 편성"] || "").includes(currentCategory))
            );

            // 💡 [수정됨] 전체 탭이 아닐 때만 팀장 고정 정렬
            if (currentCategory !== '전체') {
                filtered.sort((a, b) => {
                    const isALeader = (a["이름"] === "김미라" || a["이름"] === "이서하") ? 1 : 0;
                    const isBLeader = (b["이름"] === "김미라" || b["이름"] === "이서하") ? 1 : 0;
                    return isBLeader - isALeader;
                });
            }

            renderList(filtered);
        }

        function renderList(data) {
            const list = document.getElementById('data-list');
            list.innerHTML = '';
            document.getElementById('total-count').innerText = `총 ${data.length}명`;
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-lg shadow-sm border border-gray-200";
                card.innerHTML = `<div class="font-bold text-lg text-gray-800">${p["이름"]}</div>
                                  <div class="text-sm text-gray-500">${p["조 편성"] || '미배정'} | ${p["전화번호"] || ''}</div>`;
                list.appendChild(card);
            });
        }
        fetchData();
    </script>
</body>
</html>
