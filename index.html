<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 관리 앱</title>
    
    <!-- 폰트 및 디자인(Tailwind CSS) 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 구글 시트 CSV 파싱을 위한 라이브러리 (PapaParse) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* 앱처럼 보이게 모바일 너비 제한 (PC에서 볼 때를 위해) */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }
        /* 로딩 스피너 애니메이션 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app-container flex flex-col">
        
        <!-- 상단 헤더 영역 -->
        <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-xl font-bold">📋 참가자 관리</h1>
                <button onclick="fetchData()" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-full transition">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
            <!-- 검색 바 -->
            <input type="text" id="searchInput" placeholder="이름으로 검색..." class="w-full p-2 rounded text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-300" onkeyup="filterList()">
        </header>

        <!-- 메인 콘텐츠 영역 (데이터가 그려지는 곳) -->
        <main class="flex-1 p-4 overflow-y-auto bg-gray-50" id="app-content">
            
            <!-- 💡 추가된 부분: 부서별 탭 카테고리 메뉴 -->
            <div class="flex space-x-1 mb-4 bg-gray-200 p-1 rounded-lg">
                <button id="tab-전체" class="flex-1 py-1.5 text-sm font-bold rounded-md bg-white shadow text-blue-600 transition" onclick="setTab('전체')">전체</button>
                <button id="tab-유치부" class="flex-1 py-1.5 text-sm font-bold rounded-md text-gray-500 hover:text-gray-700 transition" onclick="setTab('유치부')">유치부</button>
                <button id="tab-어린이부" class="flex-1 py-1.5 text-sm font-bold rounded-md text-gray-500 hover:text-gray-700 transition" onclick="setTab('어린이부')">어린이부</button>
            </div>

            <div id="loading" class="text-center text-gray-500 mt-10">
                <div class="loader"></div>
                <p>구글 시트에서 데이터를 불러오는 중...</p>
            </div>
            
            <div id="error-message" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm text-center"></div>
            
            <!-- 카드 리스트 컨테이너 -->
            <div id="data-list" class="flex flex-col gap-3"></div>
        </main>

        <!-- 하단 네비게이션 (앱 느낌을 위한 장식) -->
        <footer class="bg-white border-t p-3 flex justify-around text-xs text-gray-500">
            <div class="flex flex-col items-center text-blue-600 font-bold">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15.21 12a3 3 0 11-6.42 0m6.42 0a6 6 0 01-6.42 0"></path></svg>
                참가자 명단
            </div>
            <div class="flex flex-col items-center hover:text-blue-600 transition cursor-pointer" onclick="showInfo()">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                설정 방법
            </div>
        </footer>
    </div>

    <script>
        // ★ 여기에 구글 시트에서 "웹에 게시"한 CSV 링크를 넣으세요! ★
        // (현재는 빈 칸으로 두면 테스트용 화면이 나옵니다)
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRH_Fs1olCu5C1oEiC88d6FekDDF0aNtG21_ex5sC7Y4JrGADra8HkOwwvj558rM7OUZgQMC7PpsORQ/pub?gid=1646981611&single=true&output=csv"; 

        // 전역 데이터 저장소
        let participantsData = [];
        let currentCategory = '전체'; // 💡 현재 선택된 탭을 기억하는 변수 추가

        // 화면 로드 시 즉시 데이터 가져오기 실행
        window.onload = function() {
            fetchData();
        };

        function fetchData() {
            const listContainer = document.getElementById('data-list');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-message');
            
            listContainer.innerHTML = '';
            loading.style.display = 'block';
            errorMsg.classList.add('hidden');

            // URL 형식 검사
            if (GOOGLE_SHEET_CSV_URL && GOOGLE_SHEET_CSV_URL.includes('/edit')) {
                setTimeout(() => {
                    loading.style.display = 'none';
                    errorMsg.innerHTML = "<strong>⚠️ 잘못된 링크 형식입니다!</strong><br>일반 공유 링크(주소에 '/edit' 포함)를 넣으셨습니다.<br>반드시 [파일] -> [공유] -> <strong>[웹에 게시]</strong>에서 <strong>'CSV'</strong> 형식으로 배포한 주소를 넣어주세요.";
                    errorMsg.classList.remove('hidden');
                }, 500);
                return;
            }

            // 링크가 없을 경우 회원님 시트와 동일한 구조의 가짜 데이터를 보여줍니다.
            if (!GOOGLE_SHEET_CSV_URL) {
                setTimeout(() => {
                    const mockData = [
                        ["26년도 국내선교 참가자 통합 관리대장", "", "", "", "", "", "", ""],
                        ["", "", "기준일: 2026.05.27 /", "", "", "", "", ""],
                        ["순번", "이름", "전화번호", "주민등록번호", "단체티 사이즈", "입금확인", "조 편성", "비고"],
                        ["1", "곽미경", "010-2787-5334", "831112-2017812", "XL (105)", "미납", "미배정", ""],
                        ["2", "박근종", "010-8097-3093", "870911-1005115", "XL (105)", "완납", "1조", "개별 연락 요망"],
                        ["3", "최지나", "010-2445-9176", "840508-2030412", "3XL (115)", "미납", "회계", ""],
                        ["4", "이서하", "010-6738-1257", "890807-2082625", "2XL (110)", "미납", "유치부", ""]
                    ];
                    processData(mockData);
                }, 800);
                return;
            }

            // 실제 구글 시트 URL이 있을 경우 파싱
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false, // 1~2번째 줄의 병합된 제목을 무시하기 위해 'false'로 설정하고 직접 찾습니다.
                complete: function(results) {
                    processData(results.data);
                },
                error: function(err) {
                    loading.style.display = 'none';
                    errorMsg.innerHTML = "<strong>⚠️ 데이터를 불러오는데 실패했습니다.</strong><br>1. 링크가 '웹에 게시(CSV)' 링크가 맞는지 확인해주세요.<br>2. 인터넷 연결 상태를 확인해주세요.";
                    errorMsg.classList.remove('hidden');
                }
            });
        }

        // 배열 형태의 원본 데이터를 처리하는 함수
        function processData(rawData) {
            document.getElementById('loading').style.display = 'none';
            const errorMsg = document.getElementById('error-message');

            if(rawData && rawData.length > 0) {
                // 1. 위쪽 제목 줄들을 무시하고 "이름"이라는 글자가 포함된 '진짜 데이터 기준 줄' 찾기
                let headerIndex = rawData.findIndex(row => row.includes("이름"));

                if(headerIndex === -1) {
                    errorMsg.innerHTML = `<strong>⚠️ '이름' 열을 찾을 수 없습니다.</strong><br>시트 항목 중에 <strong>'이름'</strong>이라는 칸이 있는지 확인해주세요.`;
                    errorMsg.classList.remove('hidden');
                    return;
                }

                const headers = rawData[headerIndex];
                let formattedData = [];

                // 2. 찾아낸 제목줄 아래부터 실제 데이터 묶음으로 변환
                for(let i = headerIndex + 1; i < rawData.length; i++) {
                    let row = rawData[i];
                    let obj = {};
                    for(let j = 0; j < headers.length; j++) {
                        if(headers[j]) { // 빈 제목 무시
                            obj[headers[j].trim()] = row[j] ? row[j].trim() : "";
                        }
                    }
                    formattedData.push(obj);
                }

                // 3. 이름이 없는 빈 행 걸러내기
                participantsData = formattedData.filter(person => person["이름"] && person["이름"] !== "");
                
                // 💡 렌더링 전에 필터 및 정렬(팀장 맨 뒤로)을 거치도록 renderList 대신 filterList 호출
                filterList();
            }
        }

        function renderList(dataToRender) {
            const listContainer = document.getElementById('data-list');
            listContainer.innerHTML = '';

            if(dataToRender.length === 0) {
                listContainer.innerHTML = '<p class="text-center text-gray-500 mt-5">검색 결과가 없습니다.</p>';
                return;
            }

            // 💡 현재 탭이 '전체'인지 확인 (전체일 때만 입금, 티셔츠 표시)
            const showExtraInfo = (currentCategory === '전체');

            dataToRender.forEach(person => {
                // 입금확인 여부에 따른 뱃지 색상 결정
                let payBadgeColor = "bg-gray-100 text-gray-600";
                let payStatus = person["입금확인"] || '미납';
                if(payStatus.includes("완납") || payStatus === "O") payBadgeColor = "bg-green-100 text-green-700";
                else if(payStatus.includes("미납") || payStatus === "X") payBadgeColor = "bg-red-100 text-red-700";
                
                // 조 편성 뱃지 색상 (회계, 유치부 등 특별 역할에 색상 부여)
                let groupBadge = person["조 편성"] || '미배정';
                let groupColor = "bg-blue-50 text-blue-600";
                if(groupBadge.includes("회계")) groupColor = "bg-purple-100 text-purple-700";
                else if(groupBadge.includes("유치부")) groupColor = "bg-pink-100 text-pink-700";
                else if(groupBadge.includes("어린이부")) groupColor = "bg-orange-100 text-orange-700";

                // ★ 사역팀장(김미라, 이서하) 부서별 강조 효과 설정 ★
                let cardStyle = "bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex flex-col gap-2";
                let leaderBadge = "";
                let nameColor = "text-gray-800";
                let borderColor = "";
                
                if (person["이름"] === "김미라") {
                    // 어린이부 팀장 (따뜻한 주황색 계열)
                    cardStyle = "bg-orange-50 p-4 rounded-lg shadow-md border-2 border-orange-400 flex flex-col gap-2 relative overflow-hidden";
                    leaderBadge = `<span class="text-xs font-extrabold px-2 py-0.5 rounded-md bg-gradient-to-r from-orange-400 to-orange-600 text-white shadow-sm ml-1 animate-pulse">👑 어린이부 팀장</span>`;
                    nameColor = "text-orange-900";
                    borderColor = "border-orange-200";
                } else if (person["이름"] === "이서하") {
                    // 유치부 팀장 (화사한 분홍색 계열)
                    cardStyle = "bg-pink-50 p-4 rounded-lg shadow-md border-2 border-pink-400 flex flex-col gap-2 relative overflow-hidden";
                    leaderBadge = `<span class="text-xs font-extrabold px-2 py-0.5 rounded-md bg-gradient-to-r from-pink-400 to-pink-600 text-white shadow-sm ml-1 animate-pulse">👑 유치부 팀장</span>`;
                    nameColor = "text-pink-900";
                    borderColor = "border-pink-200";
                }

                // 💡 조건에 따라 보여줄 HTML 조각 결정 (전체 탭에서만 보임)
                let payBadgeHTML = showExtraInfo ? `
                    <span class="text-xs font-bold px-3 py-1.5 rounded-full ${payBadgeColor}">
                        입금: ${payStatus}
                    </span>
                ` : '';

                let tshirtHTML = showExtraInfo ? `
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        티셔츠: <span class="font-semibold">${person["단체티 사이즈"] || '-'}</span>
                    </div>
                ` : '';

                // 카드 HTML 구조 생성
                const card = document.createElement('div');
                card.className = cardStyle;
                
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b pb-2 ${borderColor}">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="font-bold text-lg ${nameColor}">${person["이름"] || '이름 없음'}</span>
                            ${leaderBadge}
                            <span class="text-xs font-semibold px-2 py-0.5 rounded ${groupColor}">${groupBadge}</span>
                        </div>
                        ${payBadgeHTML}
                    </div>
                    <div class="flex flex-col gap-1.5 text-sm text-gray-600 mt-1">
                        <div class="flex items-center gap-2 font-medium">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            ${person["전화번호"] || '번호 없음'}
                        </div>
                        ${tshirtHTML}
                        ${person["비고"] ? `<div class="text-xs text-gray-600 bg-yellow-50 p-2 rounded mt-1 border border-yellow-100">📌 ${person["비고"]}</div>` : ''}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 💡 추가된 부분: 탭 변경 기능
        function setTab(category) {
            currentCategory = category;
            
            // 탭 디자인(색상) 변경
            const tabs = ['전체', '유치부', '어린이부'];
            tabs.forEach(tab => {
                const el = document.getElementById('tab-' + tab);
                if(tab === category) {
                    el.className = "flex-1 py-1.5 text-sm font-bold rounded-md bg-white shadow text-blue-600 transition"; // 선택된 탭
                } else {
                    el.className = "flex-1 py-1.5 text-sm font-bold rounded-md text-gray-500 hover:text-gray-700 transition"; // 선택 안 된 탭
                }
            });
            
            // 리스트 다시 필터링해서 보여주기
            filterList();
        }

        // 💡 수정된 부분: 검색, 탭 필터링, 그리고 정렬(팀장 뒤로) 기능 통합
        function filterList() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = participantsData.filter(person => {
                // 1. 검색어 검사
                const matchQuery = 
                    (person["이름"] && person["이름"].toLowerCase().includes(query)) ||
                    (person["조 편성"] && person["조 편성"].toLowerCase().includes(query)) ||
                    (person["전화번호"] && person["전화번호"].includes(query)) ||
                    (person["비고"] && person["비고"].toLowerCase().includes(query));
                
                // 2. 탭 카테고리 검사 ('전체'가 아니면 해당 부서 이름이 조 편성에 있는지 확인)
                let matchCategory = true;
                if(currentCategory !== '전체') {
                    matchCategory = person["조 편성"] && person["조 편성"].includes(currentCategory);
                }
                
                return matchQuery && matchCategory;
            });

            // 3. 정렬 로직: '전체' 탭이 아닐 때만 팀장을 맨 뒤로 정렬
            if (currentCategory !== '전체') {
                filtered.sort((a, b) => {
                    const aIsLeader = (a["이름"] === "김미라" || a["이름"] === "이서하") ? 1 : 0;
                    const bIsLeader = (b["이름"] === "김미라" || b["이름"] === "이서하") ? 1 : 0;
                    
                    return aIsLeader - bIsLeader;
                });
            }

            renderList(filtered);
        }

        function showInfo() {
            const errorMsg = document.getElementById('error-message');
            errorMsg.innerHTML = `
                <strong>내 구글 시트 연결하는 법:</strong><br><br>
                1. 구글 시트 메뉴 [파일] -> [공유] -> [웹에 게시]<br>
                2. '전체 문서'를 <strong>'CSV'</strong>로 변경 후 게시 버튼 클릭<br>
                3. 생성된 링크 복사<br>
                4. 소스코드의 <code>GOOGLE_SHEET_CSV_URL</code> 안에 링크 붙여넣기<br><br>
                <button onclick="document.getElementById('error-message').classList.add('hidden')" class="mt-2 bg-blue-200 text-blue-800 px-3 py-1 rounded">닫기</button>
            `;
            errorMsg.classList.remove('hidden');
            errorMsg.classList.replace('bg-red-100', 'bg-blue-50');
            errorMsg.classList.replace('text-red-700', 'text-blue-800');
        }
    </script>
</body>
</html>
