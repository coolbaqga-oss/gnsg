<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 7공동체 국내선교</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }
        /* 스크롤바 숨기기 */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5668d9;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app-container flex flex-col h-screen overflow-hidden">
        
        <!-- 상단 헤더 영역 (이미지 캡처본 레이아웃 적용) -->
        <header class="bg-[#5668d9] text-white pt-4 sticky top-0 z-10 shadow-md shrink-0">
            <div class="px-4">
                <div class="flex items-center gap-3 mb-4">
                    <img src="logo.jpeg" alt="로고" class="w-10 h-10 bg-white rounded-full p-1 shadow-sm object-contain" onerror="this.src='https://via.placeholder.com/36?text=Logo'">
                    <h1 class="text-xl font-bold tracking-tight">국내선교 참가 명단</h1>
                </div>
                
                <!-- 검색창, 인원수, 새로고침 나란히 배치 -->
                <div class="flex items-center gap-2 mb-4">
                    <div class="relative flex-1">
                        <input type="text" id="searchInput" placeholder="이름 또는 조 검색..." class="w-full pl-10 pr-4 py-2.5 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-300 shadow-sm text-sm" onkeyup="filterList()">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    
                    <div class="bg-[#eec04b] text-[#5c4009] px-3 py-2.5 rounded-xl text-sm font-bold shadow-sm whitespace-nowrap flex items-center justify-center gap-1.5">
                        <span class="text-base leading-none mt-[1px]">👥</span>
                        <span id="total-count" class="leading-none mt-[1px]">총 0명</span>
                    </div>

                    <button onclick="fetchData()" class="bg-[#788bf3] hover:bg-blue-400 text-white p-2.5 rounded-xl shadow-sm transition flex items-center justify-center" title="새로고침">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </div>

            <!-- 탭 메뉴 -->
            <div class="flex px-2 pt-2 bg-black/5">
                <button id="tab-전체" class="flex-1 py-2.5 text-sm font-bold bg-white text-[#5668d9] rounded-t-lg transition shadow-sm" onclick="setTab('전체')">전체</button>
                <button id="tab-유치부" class="flex-1 py-2.5 text-sm font-bold text-white/80 hover:text-white transition" onclick="setTab('유치부')">유치부</button>
                <button id="tab-어린이부" class="flex-1 py-2.5 text-sm font-bold text-white/80 hover:text-white transition" onclick="setTab('어린이부')">어린이부</button>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 (명단 출력) -->
        <main class="flex-1 p-4 overflow-y-auto bg-gray-50 pb-10" id="app-content">
            <div id="loading" class="text-center text-gray-500 mt-10">
                <div class="loader"></div>
                <p class="mt-4 font-medium">데이터를 불러오는 중...</p>
            </div>
            
            <div id="error-message" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm text-center"></div>
            
            <!-- 카드 리스트 컨테이너 -->
            <div id="data-list" class="flex flex-col gap-3"></div>
        </main>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRH_Fs1olCu5C1oEiC88d6FekDDF0aNtG21_ex5sC7Y4JrGADra8HkOwwvj558rM7OUZgQMC7PpsORQ/pub?gid=27496411&single=true&output=csv"; 

        let participantsData = [];
        let currentCategory = '전체'; 

        window.onload = function() {
            fetchData();
        };

        function fetchData() {
            const listContainer = document.getElementById('data-list');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-message');
            
            listContainer.innerHTML = '';
            loading.style.display = 'block';
            errorMsg.classList.add('hidden');

            if (GOOGLE_SHEET_CSV_URL && GOOGLE_SHEET_CSV_URL.includes('/edit')) {
                setTimeout(() => {
                    loading.style.display = 'none';
                    errorMsg.innerHTML = "<strong>⚠️ 잘못된 링크 형식입니다!</strong><br>일반 공유 링크를 넣으셨습니다.<br>반드시 [웹에 게시]에서 'CSV' 링크를 넣어주세요.";
                    errorMsg.classList.remove('hidden');
                }, 500);
                return;
            }

            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false,
                complete: function(results) {
                    processData(results.data);
                },
                error: function(err) {
                    loading.style.display = 'none';
                    errorMsg.innerHTML = "<strong>⚠️ 데이터를 불러오는데 실패했습니다.</strong><br>인터넷 연결을 확인해주세요.";
                    errorMsg.classList.remove('hidden');
                }
            });
        }

        function processData(rawData) {
            document.getElementById('loading').style.display = 'none';
            const errorMsg = document.getElementById('error-message');

            if(rawData && rawData.length > 0) {
                let headerIndex = rawData.findIndex(row => row.some(cell => typeof cell === 'string' && cell.includes("이름")));

                if(headerIndex === -1) {
                    errorMsg.innerHTML = `<strong>⚠️ '이름' 열을 찾을 수 없습니다.</strong>`;
                    errorMsg.classList.remove('hidden');
                    return;
                }

                const headers = rawData[headerIndex];
                let headerMap = {};
                for(let j = 0; j < headers.length; j++) {
                    let h = headers[j] ? headers[j].trim() : "";
                    if(h.includes("이름")) headerMap[j] = "이름";
                    else if(h.includes("전화번호") || h.includes("연락")) headerMap[j] = "전화번호";
                    else if(h.includes("단체티") || h.includes("사이즈")) headerMap[j] = "단체티 사이즈";
                    else if(h.includes("입금") || h.includes("참가비")) headerMap[j] = "입금확인";
                    else if(h.includes("조 편성") || h === "조" || h.includes("부서")) headerMap[j] = "조 편성";
                    else if(h.includes("비고")) headerMap[j] = "비고";
                }

                let formattedData = [];

                for(let i = headerIndex + 1; i < rawData.length; i++) {
                    let row = rawData[i];
                    let obj = {};
                    for(let j = 0; j < headers.length; j++) {
                        if(headerMap[j]) { 
                            let cellValue = row[j] ? row[j].trim() : "";
                            
                            // 자동완납 처리 기능 유지
                            if(headerMap[j] === "입금확인") {
                                if (cellValue.includes("완납") || cellValue === "O" || cellValue.includes("완료") || cellValue.includes("확인")) {
                                    cellValue = "완납";
                                } else if (cellValue === "미납" || cellValue === "X") {
                                    cellValue = "미납";
                                }
                            }
                            obj[headerMap[j]] = cellValue;
                        }
                    }
                    formattedData.push(obj);
                }

                participantsData = formattedData.filter(person => person["이름"] && person["이름"] !== "");
                filterList();
            }
        }

        // 💡 탭 디자인 변경 함수
        function setTab(category) {
            currentCategory = category;
            
            const tabs = ['전체', '유치부', '어린이부'];
            tabs.forEach(tab => {
                const el = document.getElementById('tab-' + tab);
                if(tab === category) {
                    el.className = "flex-1 py-2.5 text-sm font-bold bg-white text-[#5668d9] rounded-t-lg transition shadow-sm"; 
                } else {
                    el.className = "flex-1 py-2.5 text-sm font-bold text-white/80 hover:text-white transition"; 
                }
            });
            
            filterList();
        }

        function filterList() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = participantsData.filter(person => {
                const matchQuery = 
                    (person["이름"] && person["이름"].toLowerCase().includes(query)) ||
                    (person["조 편성"] && person["조 편성"].toLowerCase().includes(query)) ||
                    (person["전화번호"] && person["전화번호"].includes(query)) ||
                    (person["비고"] && person["비고"].toLowerCase().includes(query));
                
                let matchCategory = true;
                if(currentCategory !== '전체') {
                    const group = person["조 편성"] || "";
                    matchCategory = group.includes(currentCategory);
                    
                    if(currentCategory === '어린이부' && person["이름"] === "김미라") matchCategory = true;
                    if(currentCategory === '유치부' && person["이름"] === "이서하") matchCategory = true;
                }
                
                return matchQuery && matchCategory;
            });

            // 전체 탭이 아닐 때만 팀장을 맨 뒤로 정렬
            if (currentCategory !== '전체') {
                filtered.sort((a, b) => {
                    const aIsLeader = (a["이름"] === "김미라" || a["이름"] === "이서하") ? 1 : 0;
                    const bIsLeader = (b["이름"] === "김미라" || b["이름"] === "이서하") ? 1 : 0;
                    return bIsLeader - aIsLeader;
                });
            }

            renderList(filtered);
        }

        // ★ 회원님이 요청하신 명단 디자인 코딩 반영 ★
        function renderList(dataToRender) {
            const listContainer = document.getElementById('data-list');
            const totalCountEl = document.getElementById('total-count'); 
            
            listContainer.innerHTML = '';
            if (totalCountEl) {
                totalCountEl.innerText = `총 ${dataToRender.length}명`;
            }

            if(dataToRender.length === 0) {
                listContainer.innerHTML = '<p class="text-center text-gray-500 mt-5 bg-white py-8 rounded-lg shadow-sm border border-gray-100">조건에 맞는 명단이 없습니다.</p>';
                return;
            }

            const showExtraInfo = (currentCategory === '전체');

            dataToRender.forEach(person => {
                let payBadgeColor = "bg-gray-100 text-gray-600";
                let payStatus = person["입금확인"] || '미납';
                if(payStatus.includes("완납") || payStatus === "O") payBadgeColor = "bg-green-100 text-green-700";
                else if(payStatus.includes("미납") || payStatus === "X") payBadgeColor = "bg-red-100 text-red-700";
                
                let groupBadge = person["조 편성"] || '미배정';
                let groupColor = "bg-blue-50 text-blue-600";
                if(groupBadge.includes("회계")) groupColor = "bg-purple-100 text-purple-700";
                else if(groupBadge.includes("유치부")) groupColor = "bg-pink-100 text-pink-700";
                else if(groupBadge.includes("어린이부")) groupColor = "bg-orange-100 text-orange-700";

                // 사역팀장(김미라, 이서하) 부서별 강조 효과 설정
                let cardStyle = "bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex flex-col gap-2";
                let leaderBadge = "";
                let nameColor = "text-gray-800";
                let borderColor = "border-gray-200";
                
                if (person["이름"] === "김미라") {
                    cardStyle = "bg-orange-50 p-4 rounded-lg shadow-md border-2 border-orange-400 flex flex-col gap-2 relative overflow-hidden";
                    leaderBadge = `<span class="text-xs font-extrabold px-2 py-0.5 rounded-md bg-gradient-to-r from-orange-400 to-orange-600 text-white shadow-sm ml-1 animate-pulse">👑 어린이부 팀장</span>`;
                    nameColor = "text-orange-900";
                    borderColor = "border-orange-200";
                } else if (person["이름"] === "이서하") {
                    cardStyle = "bg-pink-50 p-4 rounded-lg shadow-md border-2 border-pink-400 flex flex-col gap-2 relative overflow-hidden";
                    leaderBadge = `<span class="text-xs font-extrabold px-2 py-0.5 rounded-md bg-gradient-to-r from-pink-400 to-pink-600 text-white shadow-sm ml-1 animate-pulse">👑 유치부 팀장</span>`;
                    nameColor = "text-pink-900";
                    borderColor = "border-pink-200";
                }

                let payBadgeHTML = showExtraInfo ? `
                    <span class="text-xs font-bold px-3 py-1.5 rounded-full ${payBadgeColor}">
                        입금: ${payStatus}
                    </span>
                ` : '';

                let tshirtHTML = showExtraInfo && person["단체티 사이즈"] ? `
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        티셔츠: <span class="font-semibold">${person["단체티 사이즈"]}</span>
                    </div>
                ` : '';

                const card = document.createElement('div');
                card.className = cardStyle;
                
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b pb-2 ${borderColor}">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="font-bold text-lg ${nameColor}">${person["이름"] || '이름 없음'}</span>
                            ${leaderBadge}
                            <span class="text-xs font-semibold px-2 py-0.5 rounded ${groupColor}">${groupBadge}</span>
                        </div>
                        ${payBadgeHTML}
                    </div>
                    <div class="flex flex-col gap-1.5 text-sm text-gray-600 mt-1">
                        <div class="flex items-center gap-2 font-medium">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            ${person["전화번호"] || '번호 없음'}
                        </div>
                        ${tshirtHTML}
                        ${person["비고"] ? `<div class="text-xs text-gray-600 bg-yellow-50 p-2 rounded mt-1 border border-yellow-100">📌 ${person["비고"]}</div>` : ''}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
