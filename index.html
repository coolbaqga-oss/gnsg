<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목사고시 기출문제(2015-2025)</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #f4efe6;
    --paper-2: #ece4d6;
    --card: #fbf8f1;
    --line: #d8cdb9;
    --burgundy: #7a2230;
    --burgundy-soft: #9c3a48;
    --gold: #b08545;
    --green: #3f6b48;
    --green-soft: #e3efe3;
    --red: #a23030;
    --red-soft: #f6e3e0;
    --muted: #7c7363;
    --shadow: 0 1px 2px rgba(40,30,15,.06), 0 8px 24px rgba(40,30,15,.07);
  }

  /* 다크 모드 변수 덮어쓰기 */
  body.dark {
    --ink: #f4efe6;
    --paper: #1c1a17;
    --paper-2: #252220;
    --card: #2c2925;
    --line: #4a443c;
    --burgundy: #d68aa0;
    --burgundy-soft: #b06580;
    --gold: #d4a86a;
    --green: #8fd6a0;
    --green-soft: #2c4d33;
    --red: #ff8b8b;
    --red-soft: #4d2c2c;
    --muted: #9c9489;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--paper); color: var(--ink); line-height: 1.65;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .app-container { max-width: 640px; margin: 0 auto; padding: 20px 20px calc(120px + env(safe-area-inset-bottom)); }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px 16px; }
  .title-block { min-width: 0; }
  h1 { font-size: 1.4rem; color: var(--burgundy); white-space: nowrap; line-height: 1.15; }
  .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 3px; letter-spacing: 0.03em; }
  .header-actions { display: flex; align-items: flex-end; gap: 14px; font-size: 0.78rem; flex-wrap: wrap; margin-left: auto; }
  .hdr-link { background: none; border: none; cursor: pointer; text-decoration: underline; white-space: nowrap; padding: 2px 0; color: var(--ink); font-size: 0.78rem; }
  .hdr-link.gold { color: var(--gold); }
  .hdr-link.red { color: var(--red); }

  .dashboard { display: flex; gap: 5px; margin-bottom: 15px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; box-shadow: var(--shadow); }
  .dash-item { flex: 1; text-align: center; border-right: 1px solid var(--line); }
  .dash-item:last-child { border-right: none; }
  .dash-title { font-size: 0.72rem; color: var(--muted); }
  .dash-score { font-size: 1.05rem; font-weight: bold; color: var(--burgundy); }

  .mastery { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 13px 16px; margin-bottom: 15px; box-shadow: var(--shadow); }
  .mastery-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .mastery-label { font-size: 0.78rem; color: var(--muted); }
  .mastery-val { font-size: 0.95rem; font-weight: bold; color: var(--burgundy); }
  .mastery-track { height: 10px; background: var(--paper-2); border-radius: 6px; overflow: hidden; }
  .mastery-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--burgundy), var(--gold)); border-radius: 6px; transition: width 0.45s ease; }

  .filters-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    padding: 6px 12px; background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 20px; font-size: 0.85rem; color: var(--muted); cursor: pointer; transition: 0.2s;
  }
  .chip.on { background: var(--burgundy); color: #fff; border-color: var(--burgundy); }
  .chip.pick.on::before { content: "✓ "; }

  #search-box { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem; background: var(--card); color: var(--ink); }

  .mode-tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .mode-tab { flex: 1; padding: 12px; text-align: center; background: var(--paper-2); cursor: pointer; font-weight: bold; border: none; color: var(--muted); }
  .mode-tab.on { background: var(--ink); color: var(--paper); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .q-meta { font-size: 0.85rem; color: var(--gold); font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .meta-right { display: flex; align-items: center; gap: 10px; }
  .star { cursor: pointer; }
  .q-text { font-size: calc(1.15rem * var(--fscale, 1)); font-weight: 600; margin-bottom: 12px; word-break: keep-all; overflow-wrap: anywhere; }
  
  .opt {
    display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 8px;
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: calc(1rem * var(--fscale, 1));
    word-break: keep-all; overflow-wrap: anywhere; color: var(--ink);
  }
  .opt.selected { background: var(--burgundy-soft); color: white; border-color: var(--burgundy); }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: bold; }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); text-decoration: line-through; }

  .opt-row { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
  .opt-row .opt { margin-bottom: 0; flex: 1; min-width: 0; }
  .opt-x {
    flex-shrink: 0; width: 40px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--muted); font-size: 0.95rem; cursor: pointer; line-height: 1;
  }
  .opt-x.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .opt.eliminated { opacity: .4; text-decoration: line-through; background: var(--paper); color: var(--muted); }

  .study-nav {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; gap: 10px;
    padding: 12px 16px max(24px, calc(12px + env(safe-area-inset-bottom)));
    background: rgba(255,255,255,0.96); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-top: 1px solid var(--line);
  }
  body.dark .study-nav { background: rgba(28,26,23,0.96); }
  .study-nav.show { display: flex; max-width: 640px; margin: 0 auto; }
  .snav-btn {
    flex: 1; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1rem;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .snav-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .util-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 14px; flex-wrap: wrap; }
  .font-ctrl { display: flex; align-items: center; gap: 6px; }
  .font-lbl { font-size: 0.75rem; color: var(--muted); }
  .font-btn { padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font-size: 0.8rem; cursor: pointer; }

  /* 오답노트 */
  .rv-head { font-weight: bold; color: var(--burgundy); margin: 4px 2px 12px; font-size: 1.05rem; }
  .rv-chips { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .rv-chip { padding: 7px 13px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); color: var(--muted); font-size: 0.85rem; cursor: pointer; }
  .rv-chip.on { background: var(--burgundy); color: #fff; border-color: var(--burgundy); }
  .rv-group { font-weight: bold; color: var(--burgundy); margin: 20px 2px 10px; font-size: 1rem; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .rv-card { padding: 16px; }
  .rv-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rv-tag { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 1px 8px; color: var(--ink); }
  .rv-ok  { color: var(--green); font-weight: bold; }
  .rv-bad { color: var(--red);   font-weight: bold; }
  .rv-q { font-size: calc(1.02rem * var(--fscale, 1)); font-weight: 600; margin-bottom: 10px; word-break: keep-all; overflow-wrap: anywhere; }
  .rv-opts { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .rv-opt { font-size: calc(0.92rem * var(--fscale, 1)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); overflow-wrap: anywhere; }
  .rv-opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: bold; }
  .rv-exp { font-size: calc(0.85rem * var(--fscale, 1)); line-height: 1.6; background: var(--paper-2); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; color: var(--ink); }
  .rv-go { width: 100%; padding: 10px; border: 1px solid var(--burgundy); border-radius: 8px; background: var(--card); color: var(--burgundy); font-weight: bold; font-size: 0.85rem; cursor: pointer; }

  .q-counter { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }

  .fb-panel { margin-top: 14px; padding: 16px; border-radius: 12px; animation: fbPop .18s ease; }
  @keyframes fbPop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fb-panel.ok  { background: var(--green-soft); border: 1px solid var(--green); }
  .fb-panel.bad { background: var(--red-soft);   border: 1px solid var(--red); }
  .fb-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .fb-icon { width: 26px; height: 26px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .fb-panel.ok  .fb-icon { background: var(--green); }
  .fb-panel.bad .fb-icon { background: var(--red); }
  .fb-title { font-size: 1rem; font-weight: bold; }
  .fb-panel.ok  .fb-title { color: var(--green); }
  .fb-panel.bad .fb-title { color: var(--red); }
  .fb-exp { font-size: calc(0.88rem * var(--fscale, 1)); line-height: 1.6; margin-bottom: 12px; color: var(--ink); background: rgba(255,255,255,.72); border-radius: 8px; padding: 10px 12px; }
  body.dark .fb-exp { background: rgba(0,0,0,0.2); }
  .fb-tags { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .fb-tag { font-size: 0.78rem; padding: 6px 13px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; color: var(--red); cursor: pointer; }
  .fb-gemini { width: 100%; padding: 12px; border: 1px solid #5b6ee0; border-radius: 10px; background: #eef0ff; color: #3b46b0; font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-bottom: 9px; }
  body.dark .fb-gemini { background: #2a2d52; color: #bcc4ff; border-color: #5b6ee0; }
  .fb-memo-area { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .fb-memo-lbl { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .fb-memo { width: 100%; min-height: 60px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 0.85rem; resize: vertical; }
  .fb-memo-btn { margin-top: 6px; padding: 4px 12px; border: 1px solid var(--burgundy); border-radius: 6px; background: var(--card); color: var(--burgundy); font-size: 0.8rem; cursor: pointer; }

  #toast { visibility: hidden; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 30px; z-index: 1000; pointer-events: none; white-space: nowrap; }
  #toast.show { visibility: visible; animation: fadeInOut 1.8s; }
  #toast.ok  { background: var(--green); color: #fff; }   
  #toast.bad { background: var(--red); color: #fff; }      
  @keyframes fadeInOut { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="title-block">
      <h1>목사고시 기출문제</h1>
      <div class="subtitle">2015–2025</div>
    </div>
    <div class="header-actions">
      <button class="hdr-link" onclick="toggleDarkMode()" id="dark-mode-btn">🌙</button>
      <button class="hdr-link gold" onclick="refreshApp()">새로고침</button>
      <button class="hdr-link" onclick="backupProgress()">백업</button>
      <button class="hdr-link red" onclick="openResetMenu()">초기화</button>
      <input type="file" id="restore-file" style="display:none;" onchange="handleRestore(event)">
    </div>
  </header>

  <div class="util-bar">
    <div class="font-ctrl">
      <span class="font-lbl">글자</span>
      <button class="font-btn" onclick="adjustFont(-1)">가-</button>
      <button class="font-btn" onclick="adjustFont(1)">가+</button>
    </div>
    <div class="backup-note" id="backup-note" style="font-size: 0.72rem; color: var(--muted);"></div>
  </div>

  <div class="dashboard">
    <div class="dash-item"><div class="dash-title">성경 정답률</div><div class="dash-score" id="score-bible">0%</div></div>
    <div class="dash-item"><div class="dash-title">교회사 정답률</div><div class="dash-score" id="score-history">0%</div></div>
    <div class="dash-item"><div class="dash-title">헌법 정답률</div><div class="dash-score" id="score-law">0%</div></div>
  </div>
  <div class="mastery">
    <div class="mastery-head">
      <span class="mastery-label">전체 정복률</span>
      <span class="mastery-val" id="mastery-val">0% (0/0)</span>
    </div>
    <div class="mastery-track"><div class="mastery-fill" id="mastery-fill"></div></div>
  </div>

  <div class="filters-group">
    <div class="filters" id="year-chips"></div>
    <div class="filters">
      <button class="chip subj-f on" data-subj="all">전체 과목</button>
      <button class="chip subj-f" data-subj="성경">성경</button>
      <button class="chip subj-f" data-subj="교회사">교회사</button>
      <button class="chip subj-f" data-subj="헌법">헌법</button>
      <button class="chip" data-filter="shuffle">🔀 랜덤 섞기</button>
    </div>
    <input id="search-box" type="text" placeholder="🔍 문제 키워드 검색...">
    <div class="filters">
      <button class="chip" data-filter="wrong">❌ 오답만</button>
      <button class="chip" data-filter="unsolved">🎯 아직 안 맞힌 것만</button>
      <button class="chip" data-filter="bookmark">⭐ 별표</button>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab on" data-mode="study">학습</button>
    <button class="mode-tab" data-mode="yearly">기출</button>
    <button class="mode-tab" style="color:var(--red);" data-mode="exam">모의</button>
    <button class="mode-tab" data-mode="review">오답노트</button>
  </div>

  <div id="content-area"></div>
</div>
<div id="toast"></div>

<div class="study-nav" id="study-nav">
  <button class="snav-btn" onclick="moveIdx(-1)">‹ 이전</button>
  <button class="snav-btn primary" onclick="moveIdx(1)">다음 ›</button>
</div>

<div class="cl-overlay" id="reset-modal" onclick="closeResetBg(event)" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
  <div class="cl-box" style="max-width:360px; background:var(--card); border-radius:14px;">
    <div class="cl-head" style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid var(--line);"><span>초기화</span><button onclick="closeResetMenu()" style="background:none; border:none; color:var(--muted); cursor:pointer;">✕</button></div>
    <div style="padding:16px; display:flex; flex-direction:column; gap:12px;">
      <button class="reset-opt" style="text-align:left; padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--card); cursor:pointer;" onclick="resetScores()">
        <div style="font-weight:bold;">점수만 초기화</div>
        <div style="font-size:0.8rem; color:var(--muted);">정답률·진도·통계를 0으로. 오답노트와 별표는 유지.</div>
      </button>
      <button class="reset-opt danger" style="text-align:left; padding:14px; border:1px solid var(--red); border-radius:10px; background:var(--card); cursor:pointer;" onclick="resetAll()">
        <div style="font-weight:bold; color:var(--red);">전체 초기화</div>
        <div style="font-size:0.8rem; color:var(--muted);">오답노트·별표까지 모든 기록을 삭제합니다.</div>
      </button>
    </div>
  </div>
</div>

<script>
const allQuestions = [
  // ==========================================================
  // *** 여기에 기존 코드의 900문제 데이터 (allQuestions 배열)를 그대로 붙여넣으세요 ***
  // 예: {subj:"성경",year:"2015",no:1,q:"다음 중 연결이 맞지 않는 것은?",opts:[...],a:3,e:"..."},
  // ==========================================================
];

let state = {
  years: [], subj: "all", mode: "study", idx: 0,
  yearlyYears: [], examCount: 33,
  freqOnly: false, wrongOnly: false, shuffled: false,
  bookmarkOnly: false, search: "", tagFilter: "all",
  wrongnoteOnly: false, weakOnly: false, dueOnly: false, unsolvedOnly: false,
  lastQid: localStorage.getItem("mok_last") || null,
  lastQids: JSON.parse(localStorage.getItem("mok_lasts") || "{}"),
  pendingResume: false
};

let progress = JSON.parse(localStorage.getItem("mok_prog")) || {};
let wrongNotes = JSON.parse(localStorage.getItem("mok_wrong")) || {};
let srs = JSON.parse(localStorage.getItem("mok_srs")) || {};
let bookmarks = JSON.parse(localStorage.getItem("mok_bm")) || {};
let stats = JSON.parse(localStorage.getItem("mok_stats")) || {};
let memos = JSON.parse(localStorage.getItem("mok_memos")) || {}; // 신규: 메모 기능
let streakInfo = JSON.parse(localStorage.getItem("mok_streak")) || { last: "", streak: 0 };

let exam = { active: false, list: [], idx: 0, answers: [], start: 0, duration: 0, timerId: null, source: "", timed: false };

let listCache = { key: "", list: [] };
let wrongSnapshot = new Set();
let wrongSnapActive = false;
let unsolvedSnapshot = new Set();
let unsolvedSnapActive = false;

function captureWrongSnapshot() {
  wrongSnapshot = new Set(Object.keys(progress).filter(qid => progress[qid] === "X"));
  wrongSnapActive = true;
}
function captureUnsolvedSnapshot() {
  unsolvedSnapshot = new Set();
  allQuestions.forEach(q => { const id = getQId(q); if (progress[id] !== "O") unsolvedSnapshot.add(id); });
  unsolvedSnapActive = true;
}

let shuffleKey = {};
let shuffleActive = false;
function captureShuffle() {
  shuffleKey = {};
  allQuestions.forEach(q => { shuffleKey[getQId(q)] = Math.random(); });
  shuffleActive = true;
}

function normalize(s) { return (s || "").toLowerCase().trim(); }
function formatDate(d) { return d.toISOString().split("T")[0]; }
function todayStr() { return formatDate(new Date()); }
function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }

function shuffleInPlace(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getQId(q) {
  const head = (q.q || "").replace(/\s+/g, "").slice(0, 20);
  return `${q.year}-${q.subj}-${q.no || head}`;
}

function saveAll() {
  localStorage.setItem("mok_prog", JSON.stringify(progress));
  localStorage.setItem("mok_wrong", JSON.stringify(wrongNotes));
  localStorage.setItem("mok_srs", JSON.stringify(srs));
  localStorage.setItem("mok_bm", JSON.stringify(bookmarks));
  localStorage.setItem("mok_stats", JSON.stringify(stats));
  localStorage.setItem("mok_memos", JSON.stringify(memos)); // 신규
  localStorage.setItem("mok_streak", JSON.stringify(streakInfo));
}
function invalidateList() { listCache.key = ""; }

function buildList(forExam) {
  const search = normalize(state.search);
  if (!forExam && state.wrongOnly && !wrongSnapActive) captureWrongSnapshot();
  if (!forExam && state.unsolvedOnly && !unsolvedSnapActive) captureUnsolvedSnapshot();
  let temp = allQuestions.filter(q => {
    if (!q || !q.q) return false;
    const yMatch = state.years.length === 0 || state.years.includes(q.year);
    const sMatch = state.subj === "all" || q.subj === state.subj;
    if (!yMatch || !sMatch) return false;
    if (search) {
      const blob = (q.q + " " + (q.opts || []).join(" ") + " " + (q.e || "")).toLowerCase();
      if (!blob.includes(search)) return false;
    }
    if (!forExam) {
      const qid = getQId(q);
      if (state.wrongOnly && !wrongSnapshot.has(qid)) return false;
      if (state.unsolvedOnly && !unsolvedSnapshot.has(qid)) return false;
      if (state.bookmarkOnly && !bookmarks[qid]) return false;
      if (state.tagFilter !== "all" && wrongNotes[qid]?.tag !== state.tagFilter) return false;
    }
    return true;
  });
  return temp;
}

function getList(forExam) {
  const key = JSON.stringify({ years: state.years.slice().sort(), subj: state.subj, wrongOnly: state.wrongOnly, shuffled: state.shuffled, bookmarkOnly: state.bookmarkOnly, search: state.search, tagFilter: state.tagFilter, unsolvedOnly: state.unsolvedOnly, forExam });
  if (listCache.key !== key) {
    let list = buildList(forExam);
    if (state.shuffled) {
      if (!shuffleActive) captureShuffle();
      list = list.slice().sort((a, b) => (shuffleKey[getQId(a)] || 0) - (shuffleKey[getQId(b)] || 0));
    }
    listCache = { key, list };
  }
  return listCache.list;
}

function getYearList() { return [...new Set(allQuestions.map(q => q.year))].sort(); }

function syncFilterVisibility() {
  const study = state.mode === "study";
  const snav = document.getElementById("study-nav");
  if (snav) snav.classList.toggle("show", study);
}

function render() {
  syncFilterVisibility();
  const cArea = document.getElementById("content-area");
  if (state.mode === "exam") return renderExamMode(cArea);
  if (state.mode === "yearly") return renderYearlyMode(cArea);
  if (state.mode === "review") return renderReviewMode(cArea);
  return renderStudy(cArea);
}

// 오답노트 카드
function reviewCardHtml(qid, byId) {
  const q = byId[qid];
  if (!q) return "";
  const cnt = wrongNotes[qid].count || 0;
  const tag = wrongNotes[qid].tag ? `<span class="rv-tag">${wrongNotes[qid].tag}</span>` : "";
  const status = progress[qid] === "O" ? `<span class="rv-ok">현재 정답</span>` : progress[qid] === "X" ? `<span class="rv-bad">아직 오답</span>` : `<span style="color:var(--muted)">미응시</span>`;
  const opts = q.opts.map((o, i) => `<div class="rv-opt ${i === q.a ? "correct" : ""}">${i + 1}. ${o}</div>`).join("");
  const exp = q.e ? `<div class="rv-exp">${q.e}</div>` : "";
  const memo = memos[qid] ? `<div class="rv-exp" style="background:var(--paper); border:1px dashed var(--gold); color:var(--ink);">📝 ${memos[qid]}</div>` : ""; // 메모 표시
  return `<div class="card rv-card">
    <div class="rv-meta"><span>${q.year}년 ${q.subj} · ${cnt}회 틀림</span>${tag}${status}</div>
    <div class="rv-q">${q.q}</div>
    <div class="rv-opts">${opts}</div>
    ${exp}
    ${memo}
    <button class="rv-go" onclick="gotoQuestion('${qid}')">이 문제 풀러 가기 ▶</button>
  </div>`;
}

function renderReviewMode(cArea) {
  const ids = Object.keys(wrongNotes).filter(qid => (wrongNotes[qid].count || 0) > 0);
  if (!ids.length) {
    cArea.innerHTML = `<div class="card" style="text-align:center;padding:36px 20px;color:var(--muted);">아직 틀린 문제가 없어요.<br>학습하다 틀리면 여기에 자동으로 모입니다.</div>`;
    updateDashboard();
    return;
  }
  const byId = {};
  allQuestions.forEach(q => { byId[getQId(q)] = q; });
  const valid = ids.filter(qid => byId[qid]).sort((a,b) => (wrongNotes[b].count||0) - (wrongNotes[a].count||0));
  cArea.innerHTML = `<div class="rv-head">오답노트 · ${valid.length}문제</div>${valid.map(qid => reviewCardHtml(qid, byId)).join("")}`;
  updateDashboard();
}

function gotoQuestion(qid) {
  state.mode = "study"; state.subj = "all"; state.years = [];
  state.wrongOnly = false; wrongSnapActive = false;
  invalidateList();
  const list = getList(false);
  const i = list.findIndex(item => getQId(item) === qid);
  state.idx = i >= 0 ? i : 0;
  state.pendingResume = false;
  syncAllUI(); render();
}

function adjustFont(dir) {
  let s = parseFloat(localStorage.getItem("mok_fscale") || "1") || 1;
  s = Math.round((s + dir * 0.1) * 100) / 100;
  s = Math.max(0.85, Math.min(1.6, s));
  localStorage.setItem("mok_fscale", String(s));
  applyFont();
}
function applyFont() { document.documentElement.style.setProperty("--fscale", parseFloat(localStorage.getItem("mok_fscale") || "1") || 1); }

function optionRowsHtml(opts, handler) {
  return opts.map((opt, i) =>
    `<div class="opt-row">
       <button class="opt" onclick="${handler}(${i})">${i + 1}. ${opt}</button>
       <button class="opt-x" title="소거" onclick="toggleEliminate(event, ${i})">✕</button>
     </div>`).join("");
}

function toggleEliminate(e, i) {
  e.stopPropagation();
  const row = e.currentTarget.closest(".opt-row");
  if (!row) return;
  const opt = row.querySelector(".opt");
  const x = row.querySelector(".opt-x");
  const killed = opt.classList.toggle("eliminated");
  x.classList.toggle("on", killed);
}

function renderStudy(cArea) {
  const list = getList(false);
  if (list.length === 0) {
    cArea.innerHTML = "<div class='card'>조건에 맞는 문제가 없습니다.</div>";
    updateDashboard();
    return;
  }
  if (state.pendingResume) {
    const ri = list.findIndex(item => getQId(item) === (state.lastQids[state.subj] || state.lastQid));
    state.idx = ri >= 0 ? ri : 0;
    state.pendingResume = false;
  } else if (state.idx >= list.length) state.idx = 0;
  
  const q = list[state.idx];
  const qid = getQId(q);
  state.lastQid = qid; state.lastQids[state.subj] = qid;
  localStorage.setItem("mok_last", qid); localStorage.setItem("mok_lasts", JSON.stringify(state.lastQids));

  cArea.innerHTML = `
    <div class="card">
      <div class="q-meta">
        <div><span class="q-counter">${state.idx + 1} / ${list.length}</span> | ${q.year}년 ${q.subj}</div>
        <div class="meta-right"><span class="star" onclick="toggleBm('${qid}')" style="color:${bookmarks[qid] ? 'var(--gold)' : '#ccc'}; cursor:pointer;">★</span></div>
      </div>
      <div class="q-text">${q.q}</div>
      <div id="options-area">${optionRowsHtml(q.opts, "checkAns")}</div>
      <div id="fb-slot"></div>
    </div>`;
  updateDashboard();
}

function checkAns(picked) {
  const list = getList(false);
  const q = list[state.idx];
  const qid = getQId(q);
  const isCorrect = picked === q.a;

  const opts = document.querySelectorAll(".opt");
  opts.forEach(o => { o.classList.add("answered"); o.classList.remove("eliminated"); });
  document.querySelectorAll("#options-area .opt-x").forEach(x => x.style.display = "none");
  opts[picked].classList.add("selected");
  opts[q.a].classList.add("correct");
  if (!isCorrect) opts[picked].classList.add("wrong");

  if (!isCorrect) { saveWrong(qid); saveSRS(qid, false); } else { saveSRS(qid, true); }

  const title = isCorrect ? "정답입니다!" : `오답 · 정답은 ${q.a + 1}번`;
  const icon = isCorrect ? "✓" : "✕";
  const expHtml = q.e ? `<div class="fb-exp">${q.e}</div>` : "";
  const tagsHtml = isCorrect ? "" : `<div class="fb-tags">${["헷갈림", "암기부족", "실수"].map(t => `<button class="fb-tag" onclick="setTag('${qid}', '${t}')">${t}</button>`).join("")}</div>`;
  
  // 신규: 메모 UI
  const currentMemo = memos[qid] || "";
  const memoHtml = `
    <div class="fb-memo-area">
      <div class="fb-memo-lbl">📝 나만의 암기 메모</div>
      <textarea class="fb-memo" id="memo-area">${currentMemo}</textarea>
      <button class="fb-memo-btn" onclick="saveMemo('${qid}')">메모 저장</button>
    </div>
  `;

  const slot = document.getElementById("fb-slot");
  slot.innerHTML = `
    <div class="fb-panel ${isCorrect ? "ok" : "bad"}">
      <div class="fb-head"><div class="fb-icon">${icon}</div><div class="fb-title">${title}</div></div>
      ${expHtml}
      ${tagsHtml}
      <button class="fb-gemini" id="fb-gemini-btn">✨ AI에게 1:1 과외받기</button>
      ${memoHtml}
    </div>`;

  // 신규: 1:1 맞춤형 AI 프롬프트
  const gprompt =
    `다음은 대한예수교장로회(통합) 목사고시 ${q.subj} 기출문제야.\n` +
    `[문제] ${plainText(q.q)}\n` +
    q.opts.map((o, i) => `${i + 1}. ${plainText(o)}`).join("\n") +
    `\n\n[정답] ${q.a + 1}번\n[내가 고른 답] ${picked + 1}번\n` +
    `정답이 ${q.a + 1}번인 이유와, 내가 고른 ${picked + 1}번이 왜 오답인지 성경적/신학적 근거를 들어 쉽고 친절하게 설명해줘.`;
  
  const gbtn = document.getElementById("fb-gemini-btn");
  if (gbtn) gbtn.onclick = () => askGemini(gprompt);

  if (!isCorrect) navigator.vibrate && navigator.vibrate(150); // 신규: 햅틱 피드백
  else navigator.vibrate && navigator.vibrate(50);

  updateStats(qid, isCorrect);
  progress[qid] = isCorrect ? "O" : "X";
  saveAll();
  invalidateList();
  updateDashboard();
}

function plainText(html) {
  const d = document.createElement("div");
  d.innerHTML = html == null ? "" : String(html);
  return (d.textContent || d.innerText || "").replace(/\s+/g, " ").trim();
}

function askGemini(promptText) {
  const url = "https://www.google.com/search?udm=50&q=" + encodeURIComponent(promptText);
  try {
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (e) { window.open(url, "_blank"); }
}

function moveIdx(step) {
  const list = getList(false);
  if (!list.length) return;
  if (step > 0 && state.idx >= list.length - 1) {
    cArea.innerHTML = `<div class="card" style="text-align:center; padding:40px;">학습 완료!</div>`;
    return;
  }
  let idx = state.idx + step;
  if (idx < 0) idx = 0;
  if (idx >= list.length) idx = list.length - 1;
  state.idx = idx;
  state.lastQid = getQId(list[idx]); state.lastQids[state.subj] = state.lastQid;
  localStorage.setItem("mok_last", state.lastQid); localStorage.setItem("mok_lasts", JSON.stringify(state.lastQids));
  render();
}

function toggleBm(qid) { bookmarks[qid] = !bookmarks[qid]; saveAll(); render(); }
function showToast(m, type) {
  const t = document.getElementById("toast");
  t.textContent = m;
  t.className = "show" + (type ? " " + type : "");
  setTimeout(() => t.className = "", 1400);
}
function updateStats(qid, isCorrect) {
  if (!stats[qid]) stats[qid] = { c: 0, t: 0 };
  stats[qid].t += 1; if (isCorrect) stats[qid].c += 1;
}
function updateDashboard() {
  const bySubj = { "성경": { ok: 0, tot: 0 }, "교회사": { ok: 0, tot: 0 }, "헌법": { ok: 0, tot: 0 } };
  let total = 0, ok = 0;
  allQuestions.forEach(q => {
    const qid = getQId(q);
    total++;
    if (bySubj[q.subj]) {
      bySubj[q.subj].tot++;
      if (progress[qid] === "O") { bySubj[q.subj].ok++; ok++; }
    }
  });
  const acc = o => o.tot ? Math.round((o.ok / o.tot) * 100) : 0;
  document.getElementById("score-bible").textContent = acc(bySubj["성경"]) + "%";
  document.getElementById("score-history").textContent = acc(bySubj["교회사"]) + "%";
  document.getElementById("score-law").textContent = acc(bySubj["헌법"]) + "%";
  const masteryPct = total ? Math.round((ok / total) * 100) : 0;
  document.getElementById("mastery-fill").style.width = masteryPct + "%";
  document.getElementById("mastery-val").textContent = masteryPct + "% (" + ok + "/" + total + ")";
}
function saveSRS(qid, success) {
  const today = new Date();
  const prev = srs[qid] || { interval: 0 };
  let interval = success ? (prev.interval ? Math.min(prev.interval * 2, 60) : 1) : 1;
  srs[qid] = { due: formatDate(addDays(today, interval)), interval };
}
function setTag(qid, tag) {
  if (!wrongNotes[qid]) wrongNotes[qid] = { count: 0 };
  wrongNotes[qid].tag = tag; saveAll(); invalidateList();
  showToast(`'${tag}' 태그 설정됨`); moveIdx(1);
}
function saveWrong(qid) { if (!wrongNotes[qid]) wrongNotes[qid] = { count: 0 }; wrongNotes[qid].count += 1; }
function saveMemo(qid) { // 신규: 메모 저장 함수
  const txt = document.getElementById("memo-area").value;
  if (txt.trim()) memos[qid] = txt; else delete memos[qid];
  saveAll(); showToast("메모가 저장되었습니다.");
}

// 신규: 다크모드 토글
function toggleDarkMode() {
  const isDark = document.body.classList.toggle("dark");
  localStorage.setItem("mok_dark", isDark ? "1" : "0");
  document.getElementById("dark-mode-btn").textContent = isDark ? "☀️" : "🌙";
}

function syncAllUI() {
  document.querySelectorAll(".subj-f").forEach(b => b.classList.toggle("on", b.dataset.subj === state.subj));
  document.querySelectorAll(".year-f").forEach(b => {
    const y = b.dataset.year;
    if (y === "all") b.classList.toggle("on", state.years.length === 0);
    else b.classList.toggle("on", state.years.includes(y));
  });
  document.querySelectorAll(".chip[data-filter]").forEach(btn => {
    btn.classList.toggle("on", !!state[btn.dataset.filter + "Only" || btn.dataset.filter === "shuffle" ? "shuffled" : ""]);
  });
  document.querySelectorAll(".mode-tab").forEach(btn => btn.classList.toggle("on", btn.dataset.mode === state.mode));
  document.getElementById("search-box").value = state.search || "";
}

function openResetMenu() { document.getElementById("reset-modal").style.display = "flex"; }
function closeResetMenu() { document.getElementById("reset-modal").style.display = "none"; }
function closeResetBg(e) { if (e.target.id === "reset-modal") closeResetMenu(); }
function resetScores() {
  if (!confirm("점수를 초기화?")) return;
  progress = {}; srs = {}; stats = {}; streakInfo = { last: "", streak: 0 };
  saveAll(); invalidateList(); closeResetMenu(); state.idx = 0; state.pendingResume = false;
  render(); updateDashboard();
}
function resetAll() {
  if (!confirm("전체 초기화?")) return;
  progress = {}; wrongNotes = {}; srs = {}; bookmarks = {}; stats = {}; memos = {};
  saveAll(); invalidateList(); closeResetMenu(); state.idx = 0; state.pendingResume = false;
  render(); updateDashboard();
}

function renderYearChips() {
  const wrap = document.getElementById("year-chips");
  wrap.innerHTML = `<button class="chip year-f on" data-year="all">전체 연도</button>` +
    getYearList().map(y => `<button class="chip year-f" data-year="${y}">${y}</button>`).join("");
}

window.onload = () => {
  // 다크모드 로드
  if (localStorage.getItem("mok_dark") === "1") {
    document.body.classList.add("dark");
    document.getElementById("dark-mode-btn").textContent = "☀️";
  }

  renderYearChips();
  applyFont();

  document.querySelectorAll(".year-f").forEach(btn => {
    btn.onclick = () => {
      const y = btn.dataset.year;
      if (y === "all") state.years = [];
      else {
        if (state.years.includes(y)) state.years = state.years.filter(v => v !== y);
        else state.years.push(y);
      }
      syncAllUI(); state.pendingResume = true; invalidateList(); render();
    };
  });

  document.querySelectorAll(".subj-f").forEach(btn => {
    btn.onclick = () => {
      state.subj = btn.dataset.subj;
      syncAllUI(); state.pendingResume = true; invalidateList(); render();
    };
  });

  const filterMap = { wrong: "wrongOnly", unsolved: "unsolvedOnly", shuffle: "shuffled", bookmark: "bookmarkOnly" };
  document.querySelectorAll(".chip[data-filter]").forEach(btn => {
    btn.onclick = () => {
      const key = filterMap[btn.dataset.filter];
      state[key] = !state[key];
      btn.classList.toggle("on");
      if (state.wrongOnly) captureWrongSnapshot(); else wrongSnapActive = false;
      if (state.unsolvedOnly) captureUnsolvedSnapshot(); else unsolvedSnapActive = false;
      if (state.shuffled) { captureShuffle(); state.idx = 0; state.pendingResume = false; }
      else { state.pendingResume = true; }
      invalidateList(); render();
    };
  });

  document.getElementById("search-box").oninput = e => {
    state.search = e.target.value.trim();
    state.pendingResume = true; invalidateList(); render();
  };

  document.querySelectorAll(".mode-tab").forEach(btn => {
    btn.onclick = () => {
      state.mode = btn.dataset.mode;
      syncAllUI(); state.pendingResume = true; render();
    };
  });

  // 신규: 모바일 스와이프 제스처
  let touchStartX = 0, touchEndX = 0;
  const cArea = document.getElementById("content-area");
  cArea.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  cArea.addEventListener("touchend", e => {
    touchEndX = e.changedTouches[0].screenX;
    if (touchEndX < touchStartX - 50) moveIdx(1);       // 왼쪽으로 스와이프 (다음)
    if (touchEndX > touchStartX + 50) moveIdx(-1);      // 오른쪽으로 스와이프 (이전)
  }, { passive: true });

  state.pendingResume = true;
  render();
  updateDashboard();
};
</script>
</body>
</html>
