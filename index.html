<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목사고시 기출문제(2015-2025)</title>
<style>
  :root {
    --ink: #1c1a17; --paper: #f4efe6; --paper-2: #ece4d6; --card: #fbf8f1;
    --line: #d8cdb9; --burgundy: #7a2230; --burgundy-soft: #9c3a48;
    --gold: #b08545; --green: #3f6b48; --green-soft: #e3efe3;
    --red: #a23030; --red-soft: #f6e3e0; --muted: #7c7363;
    --shadow: 0 1px 2px rgba(40,30,15,.06), 0 8px 24px rgba(40,30,15,.07);
  }
  body.dark {
    --ink: #f4efe6; --paper: #1c1a17; --paper-2: #252220; --card: #2c2925;
    --line: #4a443c; --burgundy: #d68aa0; --burgundy-soft: #b06580;
    --gold: #d4a86a; --green: #8fd6a0; --green-soft: #2c4d33;
    --red: #ff8b8b; --red-soft: #4d2c2c; --muted: #9c9489;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.65; transition: background 0.3s, color 0.3s; }
  .app-container { max-width: 640px; margin: 0 auto; padding: 20px 20px calc(120px + env(safe-area-inset-bottom)); }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px 16px; }
  h1 { font-size: 1.4rem; color: var(--burgundy); white-space: nowrap; line-height: 1.15; }
  .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }
  .header-actions { display: flex; align-items: flex-end; gap: 14px; font-size: 0.78rem; flex-wrap: wrap; margin-left: auto; }
  .hdr-link { background: none; border: none; cursor: pointer; text-decoration: underline; white-space: nowrap; color: var(--ink); font-size: 0.78rem; }
  .hdr-link.gold { color: var(--gold); }
  .hdr-link.red { color: var(--red); }

  .dashboard { display: flex; gap: 5px; margin-bottom: 15px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; box-shadow: var(--shadow); }
  .dash-item { flex: 1; text-align: center; border-right: 1px solid var(--line); }
  .dash-item:last-child { border-right: none; }
  .dash-title { font-size: 0.72rem; color: var(--muted); }
  .dash-score { font-size: 1.05rem; font-weight: bold; color: var(--burgundy); }

  .mastery { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 13px 16px; margin-bottom: 15px; box-shadow: var(--shadow); }
  .mastery-head { display: flex; justify-content: space-between; margin-bottom: 9px; }
  .mastery-label { font-size: 0.78rem; color: var(--muted); }
  .mastery-val { font-size: 0.95rem; font-weight: bold; color: var(--burgundy); }
  .mastery-track { height: 10px; background: var(--paper-2); border-radius: 6px; overflow: hidden; }
  .mastery-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--burgundy), var(--gold)); border-radius: 6px; transition: width 0.45s; }

  .filters-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { padding: 6px 12px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 20px; font-size: 0.85rem; color: var(--muted); cursor: pointer; transition: 0.2s; }
  .chip.on { background: var(--burgundy); color: #fff; border-color: var(--burgundy); }
  .chip.pick.on::before { content: "✓ "; }

  #search-box { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem; background: var(--card); color: var(--ink); }
  .mode-tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .mode-tab { flex: 1; padding: 12px; text-align: center; background: var(--paper-2); cursor: pointer; font-weight: bold; border: none; color: var(--muted); }
  .mode-tab.on { background: var(--ink); color: var(--paper); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .q-meta { font-size: 0.85rem; color: var(--gold); font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .q-text { font-size: calc(1.15rem * var(--fscale, 1)); font-weight: 600; margin-bottom: 12px; word-break: keep-all; overflow-wrap: anywhere; }
  
  .opt { display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 8px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: calc(1rem * var(--fscale, 1)); word-break: keep-all; overflow-wrap: anywhere; color: var(--ink); }
  .opt.selected { background: var(--burgundy-soft); color: white; border-color: var(--burgundy); }
  .opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: bold; }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); text-decoration: line-through; }

  .opt-row { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
  .opt-row .opt { margin-bottom: 0; flex: 1; min-width: 0; }
  .opt-x { flex-shrink: 0; width: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--muted); font-size: 0.95rem; cursor: pointer; line-height: 1; }
  .opt-x.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .opt.eliminated { opacity: .4; text-decoration: line-through; background: var(--paper); color: var(--muted); }

  .study-nav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; gap: 10px; padding: 12px 16px max(24px, calc(12px + env(safe-area-inset-bottom))); background: rgba(255,255,255,0.96); backdrop-filter: blur(6px); border-top: 1px solid var(--line); }
  body.dark .study-nav { background: rgba(28,26,23,0.96); }
  .study-nav.show { display: flex; max-width: 640px; margin: 0 auto; }
  .snav-btn { flex: 1; padding: 15px; border-radius: 10px; font-weight: bold; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .snav-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .util-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 14px; flex-wrap: wrap; }
  .font-btn { padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font-size: 0.8rem; cursor: pointer; }

  .rv-head { font-weight: bold; color: var(--burgundy); margin: 4px 2px 12px; font-size: 1.05rem; }
  .rv-card { padding: 16px; }
  .rv-q { font-size: calc(1.02rem * var(--fscale, 1)); font-weight: 600; margin-bottom: 10px; word-break: keep-all; }
  .rv-opt { font-size: calc(0.92rem * var(--fscale, 1)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
  .rv-opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: bold; }
  .rv-exp { font-size: calc(0.85rem * var(--fscale, 1)); line-height: 1.6; background: var(--paper-2); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; color: var(--ink); }
  .rv-go { width: 100%; padding: 10px; border: 1px solid var(--burgundy); border-radius: 8px; background: var(--card); color: var(--burgundy); font-weight: bold; cursor: pointer; }

  .fb-panel { margin-top: 14px; padding: 16px; border-radius: 12px; }
  .fb-panel.ok  { background: var(--green-soft); border: 1px solid var(--green); }
  .fb-panel.bad { background: var(--red-soft); border: 1px solid var(--red); }
  .fb-exp { font-size: calc(0.88rem * var(--fscale, 1)); margin-bottom: 12px; background: rgba(255,255,255,.72); border-radius: 8px; padding: 10px 12px; }
  body.dark .fb-exp { background: rgba(0,0,0,0.2); }
  .fb-gemini { width: 100%; padding: 12px; border: 1px solid #5b6ee0; border-radius: 10px; background: #eef0ff; color: #3b46b0; font-weight: bold; cursor: pointer; margin-bottom: 9px; }
  body.dark .fb-gemini { background: #2a2d52; color: #bcc4ff; }
  .fb-memo { width: 100%; min-height: 60px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 0.85rem; resize: vertical; }
  
  .exam-timer { background: var(--burgundy); color: white; padding: 10px; text-align: center; font-weight: bold; border-radius: 8px; }
  .no-timer { background: var(--paper-2); color: var(--muted); border: 1px dashed var(--line); }
  
  #toast { visibility: hidden; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 30px; z-index: 1000; }
  #toast.show { visibility: visible; animation: fadeInOut 1.8s; }
  @keyframes fadeInOut { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="title-block">
      <h1>목사고시 기출문제</h1>
      <div class="subtitle">2015–2025</div>
    </div>
    <div class="header-actions">
      <button class="hdr-link" onclick="toggleDarkMode()" id="dark-mode-btn">🌙</button>
      <button class="hdr-link gold" onclick="refreshApp()">새로고침</button>
      <button class="hdr-link" onclick="backupProgress()">백업</button>
      <button class="hdr-link red" onclick="openResetMenu()">초기화</button>
      <input type="file" id="restore-file" style="display:none;" onchange="handleRestore(event)">
    </div>
  </header>

  <div class="util-bar">
    <div class="font-ctrl" style="display:flex; gap:6px; align-items:center;">
      <span style="font-size:0.75rem; color:var(--muted);">글자</span>
      <button class="font-btn" onclick="adjustFont(-1)">가-</button>
      <button class="font-btn" onclick="adjustFont(1)">가+</button>
    </div>
    <div id="backup-note" style="font-size: 0.72rem; color: var(--muted);"></div>
  </div>

  <div class="dashboard">
    <div class="dash-item"><div class="dash-title">성경 정답률</div><div class="dash-score" id="score-bible">0%</div></div>
    <div class="dash-item"><div class="dash-title">교회사 정답률</div><div class="dash-score" id="score-history">0%</div></div>
    <div class="dash-item"><div class="dash-title">헌법 정답률</div><div class="dash-score" id="score-law">0%</div></div>
  </div>
  <div class="mastery">
    <div class="mastery-head">
      <span class="mastery-label">전체 정복률</span>
      <span class="mastery-val" id="mastery-val">0% (0/0)</span>
    </div>
    <div class="mastery-track"><div class="mastery-fill" id="mastery-fill"></div></div>
  </div>

  <div class="filters-group">
    <div class="filters" id="year-chips"></div>
    <div class="filters">
      <button class="chip subj-f on" data-subj="all">전체 과목</button>
      <button class="chip subj-f" data-subj="성경">성경</button>
      <button class="chip subj-f" data-subj="교회사">교회사</button>
      <button class="chip subj-f" data-subj="헌법">헌법</button>
      <button class="chip" data-filter="shuffle">🔀 랜덤 섞기</button>
    </div>
    <input id="search-box" type="text" placeholder="🔍 문제 키워드 검색...">
    <div class="filters">
      <button class="chip" data-filter="wrong">❌ 오답만</button>
      <button class="chip" data-filter="unsolved">🎯 아직 안 맞힌 것만</button>
      <button class="chip" data-filter="bookmark">⭐ 별표</button>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab on" data-mode="study">학습</button>
    <button class="mode-tab" data-mode="yearly">기출</button>
    <button class="mode-tab" style="color:var(--red);" data-mode="exam">모의</button>
    <button class="mode-tab" data-mode="review">오답노트</button>
  </div>

  <div id="content-area"></div>
</div>
<div id="toast"></div>

<div class="study-nav" id="study-nav">
  <button class="snav-btn" onclick="moveIdx(-1)">‹ 이전</button>
  <button class="snav-btn primary" onclick="moveIdx(1)">다음 ›</button>
</div>

<div id="reset-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
  <div style="max-width:360px; background:var(--card); border-radius:14px;">
    <div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid var(--line);"><span>초기화</span><button onclick="closeResetMenu()" style="background:none; border:none; color:var(--muted); cursor:pointer;">✕</button></div>
    <div style="padding:16px; display:flex; flex-direction:column; gap:12px;">
      <button style="text-align:left; padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--card); cursor:pointer;" onclick="resetScores()">
        <div style="font-weight:bold;">점수만 초기화</div>
        <div style="font-size:0.8rem; color:var(--muted);">정답률·진도·통계를 0으로. 오답노트와 별표는 유지.</div>
      </button>
      <button style="text-align:left; padding:14px; border:1px solid var(--red); border-radius:10px; background:var(--card); cursor:pointer;" onclick="resetAll()">
        <div style="font-weight:bold; color:var(--red);">전체 초기화</div>
        <div style="font-size:0.8rem; color:var(--muted);">오답노트·별표까지 모든 기록을 삭제합니다.</div>
      </button>
    </div>
  </div>
</div>

<script>
const allQuestions = [
  // *** 여기에 기존 900문제 데이터 (allQuestions 배열)를 그대로 붙여넣으세요 ***
];

let state = {
  years: [], subj: "all", mode: "study", idx: 0,
  yearlyYears: [], examCount: 33,
  wrongOnly: false, shuffled: false, bookmarkOnly: false, search: "",
  unsolvedOnly: false, lastQid: null, lastQids: {}, pendingResume: false
};

let progress = JSON.parse(localStorage.getItem("mok_prog")) || {};
let wrongNotes = JSON.parse(localStorage.getItem("mok_wrong")) || {};
let srs = JSON.parse(localStorage.getItem("mok_srs")) || {};
let bookmarks = JSON.parse(localStorage.getItem("mok_bm")) || {};
let stats = JSON.parse(localStorage.getItem("mok_stats")) || {};
let memos = JSON.parse(localStorage.getItem("mok_memos")) || {};
let listCache = { key: "", list: [] };
let exam = { active: false, list: [], idx: 0, answers: [], start: 0, duration: 0, timerId: null, source: "", timed: false };

function getQId(q) { return `${q.year}-${q.subj}-${q.no || (q.q || "").replace(/\s+/g, "").slice(0, 20)}`; }
function saveAll() {
  localStorage.setItem("mok_prog", JSON.stringify(progress));
  localStorage.setItem("mok_wrong", JSON.stringify(wrongNotes));
  localStorage.setItem("mok_bm", JSON.stringify(bookmarks));
  localStorage.setItem("mok_stats", JSON.stringify(stats));
  localStorage.setItem("mok_memos", JSON.stringify(memos));
}
function invalidateList() { listCache.key = ""; }
function getYearList() { return [...new Set(allQuestions.map(q => q.year))].sort(); }

function getList(forExam) {
  const key = JSON.stringify({ years: state.years.slice().sort(), subj: state.subj, wrongOnly: state.wrongOnly, shuffled: state.shuffled, bookmarkOnly: state.bookmarkOnly, search: state.search, unsolvedOnly: state.unsolvedOnly, forExam });
  if (listCache.key !== key) {
    let list = allQuestions.filter(q => {
      if (state.years.length && !state.years.includes(q.year)) return false;
      if (state.subj !== "all" && q.subj !== state.subj) return false;
      if (state.search && !(q.q + q.opts.join(" ") + q.e).toLowerCase().includes(state.search.toLowerCase())) return false;
      if (!forExam) {
        const qid = getQId(q);
        if (state.wrongOnly && progress[qid] !== "X") return false;
        if (state.unsolvedOnly && progress[qid] === "O") return false;
        if (state.bookmarkOnly && !bookmarks[qid]) return false;
      }
      return true;
    });
    if (state.shuffled) list.sort(() => Math.random() - 0.5);
    listCache = { key, list };
  }
  return listCache.list;
}

function render() {
  const cArea = document.getElementById("content-area");
  document.getElementById("study-nav").classList.toggle("show", state.mode === "study");
  if (state.mode === "exam") return renderExamMode(cArea);
  if (state.mode === "yearly") return renderYearlyMode(cArea);
  if (state.mode === "review") return renderReviewMode(cArea);
  return renderStudy(cArea);
}

function renderStudy(cArea) {
  const list = getList(false);
  if (!list.length) { cArea.innerHTML = "<div class='card'>조건에 맞는 문제가 없습니다.</div>"; return; }
  if (state.idx >= list.length) state.idx = 0;
  const q = list[state.idx], qid = getQId(q);
  state.lastQid = qid;
  
  cArea.innerHTML = `
    <div class="card">
      <div class="q-meta">
        <div>${state.idx + 1} / ${list.length} | ${q.year}년 ${q.subj}</div>
        <div><span class="star" onclick="toggleBm('${qid}')" style="color:${bookmarks[qid] ? 'var(--gold)' : '#ccc'}; cursor:pointer;">★</span></div>
      </div>
      <div class="q-text">${q.q}</div>
      <div id="options-area">
        ${q.opts.map((o, i) => `<div class="opt-row"><button class="opt" onclick="checkAns(${i})">${i + 1}. ${o}</button><button class="opt-x" onclick="event.stopPropagation(); this.previousElementSibling.classList.toggle('eliminated'); this.classList.toggle('on');">✕</button></div>`).join("")}
      </div>
      <div id="fb-slot"></div>
    </div>`;
  updateDashboard();
}

function checkAns(picked) {
  const list = getList(false), q = list[state.idx], qid = getQId(q), isCorrect = picked === q.a;
  const opts = document.querySelectorAll(".opt");
  opts.forEach(o => o.classList.add("answered"));
  document.querySelectorAll(".opt-x").forEach(x => x.style.display = "none");
  opts[picked].classList.add("selected");
  opts[q.a].classList.add("correct");
  if (!isCorrect) opts[picked].classList.add("wrong");

  if (!isCorrect) { if (!wrongNotes[qid]) wrongNotes[qid] = { count: 0 }; wrongNotes[qid].count += 1; }
  if (!stats[qid]) stats[qid] = { c: 0, t: 0 }; stats[qid].t += 1; if (isCorrect) stats[qid].c += 1;
  progress[qid] = isCorrect ? "O" : "X";

  const expHtml = q.e ? `<div class="fb-exp">${q.e}</div>` : "";
  const tagsHtml = isCorrect ? "" : `<div style="display:flex; gap:6px; margin-bottom:14px;"><button class="chip" onclick="setTag('${qid}','헷갈림')">헷갈림</button><button class="chip" onclick="setTag('${qid}','암기부족')">암기부족</button></div>`;
  const memoHtml = `<div style="margin-top:12px; border-top:1px dashed var(--line); padding-top:10px;"><div style="font-size:0.8rem; color:var(--muted); margin-bottom:6px;">📝 나만의 암기 메모</div><textarea class="fb-memo" id="memo-area">${memos[qid] || ""}</textarea><button class="font-btn" style="margin-top:6px; color:var(--burgundy); border-color:var(--burgundy);" onclick="saveMemo('${qid}')">메모 저장</button></div>`;
  
  document.getElementById("fb-slot").innerHTML = `
    <div class="fb-panel ${isCorrect ? "ok" : "bad"}">
      <div style="display:flex; gap:9px; margin-bottom:10px; align-items:center;"><div style="width:26px; height:26px; border-radius:50%; background:${isCorrect ? 'var(--green)' : 'var(--red)'}; color:#fff; display:flex; align-items:center; justify-content:center;">${isCorrect ? '✓' : '✕'}</div><div style="font-weight:bold; color:${isCorrect ? 'var(--green)' : 'var(--red)'};">${isCorrect ? '정답입니다!' : `오답 · 정답은 ${q.a + 1}번`}</div></div>
      ${expHtml}${tagsHtml}
      <button class="fb-gemini" id="fb-gemini-btn">✨ AI에게 1:1 과외받기</button>
      ${memoHtml}
    </div>`;

  const gprompt = `다음은 대한예수교장로회(통합) 목사고시 ${q.subj} 기출문제야.\n[문제] ${q.q}\n${q.opts.map((o, i) => `${i + 1}. ${o}`).join("\n")}\n\n[정답] ${q.a + 1}번\n[내가 고른 답] ${picked + 1}번\n정답이 ${q.a + 1}번인 이유와, 내가 고른 ${picked + 1}번이 왜 오답인지 신학적 근거를 들어 설명해줘.`;
  document.getElementById("fb-gemini-btn").onclick = () => window.open("https://www.google.com/search?udm=50&q=" + encodeURIComponent(gprompt), "_blank");

  if (navigator.vibrate) navigator.vibrate(isCorrect ? 50 : 150);
  saveAll(); invalidateList(); updateDashboard();
}

function moveIdx(step) {
  const list = getList(false);
  if (!list.length) return;
  if (step > 0 && state.idx >= list.length - 1) { document.getElementById("content-area").innerHTML = "<div class='card' style='text-align:center; padding:40px;'>학습 완료!</div>"; return; }
  state.idx = Math.max(0, Math.min(list.length - 1, state.idx + step));
  render();
}

function renderReviewMode(cArea) {
  const ids = Object.keys(wrongNotes).filter(qid => wrongNotes[qid].count > 0);
  if (!ids.length) { cArea.innerHTML = `<div class="card" style="text-align:center;padding:36px;">아직 틀린 문제가 없어요.</div>`; return; }
  const byId = {}; allQuestions.forEach(q => byId[getQId(q)] = q);
  cArea.innerHTML = `<div class="rv-head">오답노트</div>` + ids.filter(qid => byId[qid]).map(qid => {
    const q = byId[qid];
    return `<div class="card rv-card"><div style="color:var(--muted); margin-bottom:8px;">${q.year}년 ${q.subj} · ${wrongNotes[qid].count}회 틀림</div><div class="rv-q">${q.q}</div><div style="margin-bottom:10px;">${q.opts.map((o,i)=>`<div class="rv-opt ${i===q.a?'correct':''}">${i+1}. ${o}</div>`).join("")}</div>${q.e?`<div class="rv-exp">${q.e}</div>`:''}${memos[qid]?`<div class="rv-exp" style="border:1px dashed var(--gold);">📝 ${memos[qid]}</div>`:''}<button class="rv-go" onclick="gotoQuestion('${qid}')">이 문제 풀러 가기 ▶</button></div>`;
  }).join("");
}

function gotoQuestion(qid) {
  state.mode = "study"; state.subj = "all"; state.years = []; state.wrongOnly = false; invalidateList();
  state.idx = getList(false).findIndex(item => getQId(item) === qid);
  state.pendingResume = false; syncAllUI(); render();
}

function renderYearlyMode(cArea) {
  if (exam.active && exam.source === "yearly") return renderExamScreen(cArea);
  cArea.innerHTML = `
    <div class="card">
      <div class="q-text">기출 연도 선택</div>
      <div class="filters" style="margin-top:10px;">
        ${getYearList().map(y => `<button class="chip pick ${state.yearlyYears.includes(y) ? "on" : ""}" onclick="toggleYearPick('${y}')">${y}</button>`).join("")}
      </div>
      <button class="snav-btn primary" style="width:100%; margin-top:15px;" onclick="startYearlyExam()">기출 풀이 시작</button>
    </div>`;
}

function toggleYearPick(y) {
  if (state.yearlyYears.includes(y)) state.yearlyYears = state.yearlyYears.filter(v => v !== y);
  else state.yearlyYears.push(y);
  renderYearlyMode(document.getElementById("content-area"));
}

function startYearlyExam() {
  const list = allQuestions.filter(q => state.yearlyYears.includes(q.year));
  if (!list.length) { showToast("연도를 선택하세요."); return; }
  startExamWithList(list, list.length, 0, "yearly", false);
}

function renderExamMode(cArea) {
  if (exam.active && exam.source === "exam") return renderExamScreen(cArea);
  cArea.innerHTML = `
    <div class="card">
      <div class="q-text">모의고사 설정</div>
      <div style="display:flex; gap:10px; margin-bottom:8px;">
        <input id="exam-count" type="number" value="33" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink);" placeholder="문항 수">
        <select id="exam-time" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink);">
          <option value="30">30분</option><option value="40" selected>40분</option><option value="60">60분</option>
        </select>
      </div>
      <button class="snav-btn primary" style="width:100%; margin-top:12px;" onclick="startExam()">모의고사 시작</button>
    </div>`;
}

function startExam() {
  const list = allQuestions.filter(q => q.year !== "빈출");
  const count = Math.min(parseInt(document.getElementById("exam-count").value) || 33, list.length);
  const minutes = parseInt(document.getElementById("exam-time").value);
  startExamWithList(list, count, minutes, "exam", true);
}

function startExamWithList(list, count, minutes, source, timed) {
  exam.list = list.sort(() => Math.random() - 0.5).slice(0, count);
  exam.idx = 0; exam.answers = []; exam.active = true; exam.source = source; exam.timed = timed;
  if (timed) { exam.start = Date.now(); exam.duration = minutes * 60; startExamTimer(); }
  renderExamScreen(document.getElementById("content-area"));
}

function renderExamScreen(cArea) {
  const q = exam.list[exam.idx];
  const timerHtml = exam.timed ? `<div class="exam-timer" id="exam-timer" style="flex:1;">남은 시간: ${formatTime(getExamLeft())}</div>` : `<div class="exam-timer no-timer" style="flex:1;">시간 제한 없음</div>`;
  cArea.innerHTML = `
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      ${timerHtml}
      <button class="snav-btn" style="flex:0 0 auto; padding:10px 14px;" onclick="stopExam()">종료</button>
    </div>
    <div class="card">
      <div class="q-meta"><div>${exam.source === "yearly" ? "기출" : "모의고사"} | ${exam.idx + 1} / ${exam.list.length} | ${q.year}년 ${q.subj}</div></div>
      <div class="q-text">${q.q}</div>
      <div>${q.opts.map((o, i) => `<button class="opt" onclick="pickExam(${i})">${i + 1}. ${o}</button>`).join("")}</div>
    </div>`;
  window.scrollTo(0, 0);
}

function pickExam(picked) {
  exam.answers[exam.idx] = picked;
  if (exam.idx < exam.list.length - 1) { exam.idx++; renderExamScreen(document.getElementById("content-area")); }
  else finishExam("done");
}

function stopExam() { if (confirm("시험을 종료하시겠습니까?")) finishExam("manual"); }
function startExamTimer() {
  clearInterval(exam.timerId);
  exam.timerId = setInterval(() => {
    if (!exam.active) return;
    const left = getExamLeft(), el = document.getElementById("exam-timer");
    if (el) el.textContent = "남은 시간: " + formatTime(left);
    if (left <= 0) finishExam("timeover");
  }, 500);
}
function getExamLeft() { return Math.max(0, exam.duration - Math.floor((Date.now() - exam.start) / 1000)); }
function formatTime(sec) { return `${Math.floor(sec / 60)}:${(sec % 60).toString().padStart(2, "0")}`; }

function finishExam(reason) {
  clearInterval(exam.timerId); exam.active = false;
  let correct = 0; const wrongItems = [];
  exam.list.forEach((q, i) => { if (exam.answers[i] === q.a) correct++; else wrongItems.push({ q, picked: exam.answers[i] }); });
  const score = Math.round((correct / exam.list.length) * 100);
  
  document.getElementById("content-area").innerHTML = `
    <div class="card">
      <div class="q-text">${reason === "timeover" ? "시간 종료" : "시험 완료"}</div>
      <div style="font-weight:bold; font-size:1.2rem; margin-bottom:10px;">점수: ${score}점 (${correct}/${exam.list.length})</div>
      ${wrongItems.map(w => `<div style="padding:10px; border-top:1px dashed var(--line);"><div style="color:var(--gold); font-weight:bold;">오답: ${w.q.year}년 ${w.q.subj}</div><div>${w.q.q}</div><div style="margin-top:6px;">정답: ${w.q.a + 1}번 / 선택: ${w.picked !== undefined ? w.picked + 1 : "미응답"}</div><div style="margin-top:6px; color:var(--muted);">${w.q.e || ""}</div></div>`).join("")}
      <button class="snav-btn primary" style="width:100%; margin-top:15px;" onclick="state.mode='study'; syncAllUI(); render();">다시 돌아가기</button>
    </div>`;
}

function toggleBm(qid) { bookmarks[qid] = !bookmarks[qid]; saveAll(); render(); }
function setTag(qid, tag) { if (!wrongNotes[qid]) wrongNotes[qid] = {count:0}; wrongNotes[qid].tag = tag; saveAll(); showToast(`'${tag}' 태그 설정됨`); moveIdx(1); }
function saveMemo(qid) { const txt = document.getElementById("memo-area").value; if (txt.trim()) memos[qid] = txt; else delete memos[qid]; saveAll(); showToast("메모 저장됨"); }
function showToast(m) { const t = document.getElementById("toast"); t.textContent = m; t.className = "show"; setTimeout(() => t.className = "", 1400); }
function adjustFont(dir) { let s = Math.max(0.85, Math.min(1.6, (parseFloat(localStorage.getItem("mok_fscale") || "1") || 1) + dir * 0.1)); localStorage.setItem("mok_fscale", s); applyFont(); }
function applyFont() { document.documentElement.style.setProperty("--fscale", localStorage.getItem("mok_fscale") || 1); }
function toggleDarkMode() { const isDark = document.body.classList.toggle("dark"); localStorage.setItem("mok_dark", isDark ? "1" : "0"); document.getElementById("dark-mode-btn").textContent = isDark ? "☀️" : "🌙"; }
function openResetMenu() { document.getElementById("reset-modal").style.display = "flex"; }
function closeResetMenu() { document.getElementById("reset-modal").style.display = "none"; }
function resetScores() { if (!confirm("점수를 초기화?")) return; progress = {}; stats = {}; saveAll(); invalidateList(); closeResetMenu(); render(); }
function resetAll() { if (!confirm("전체 초기화?")) return; progress = {}; wrongNotes = {}; bookmarks = {}; stats = {}; memos = {}; saveAll(); invalidateList(); closeResetMenu(); render(); }

function syncAllUI() {
  document.querySelectorAll(".subj-f").forEach(b => b.classList.toggle("on", b.dataset.subj === state.subj));
  document.querySelectorAll(".year-f").forEach(b => b.classList.toggle("on", state.years.length === 0 ? b.dataset.year === "all" : state.years.includes(b.dataset.year)));
  document.querySelectorAll(".chip[data-filter]").forEach(btn => {
    const map = { wrong: "wrongOnly", unsolved: "unsolvedOnly", shuffle: "shuffled", bookmark: "bookmarkOnly" };
    btn.classList.toggle("on", !!state[map[btn.dataset.filter]]);
  });
  document.querySelectorAll(".mode-tab").forEach(btn => btn.classList.toggle("on", btn.dataset.mode === state.mode));
}

function updateDashboard() {
  const bySubj = { "성경": { ok: 0, tot: 0 }, "교회사": { ok: 0, tot: 0 }, "헌법": { ok: 0, tot: 0 } };
  let total = 0, ok = 0;
  allQuestions.forEach(q => {
    total++; if (bySubj[q.subj]) { bySubj[q.subj].tot++; if (progress[getQId(q)] === "O") { bySubj[q.subj].ok++; ok++; } }
  });
  const acc = o => o.tot ? Math.round((o.ok / o.tot) * 100) : 0;
  document.getElementById("score-bible").textContent = acc(bySubj["성경"]) + "%";
  document.getElementById("score-history").textContent = acc(bySubj["교회사"]) + "%";
  document.getElementById("score-law").textContent = acc(bySubj["헌법"]) + "%";
  document.getElementById("mastery-fill").style.width = (total ? Math.round((ok / total) * 100) : 0) + "%";
  document.getElementById("mastery-val").textContent = (total ? Math.round((ok / total) * 100) : 0) + "% (" + ok + "/" + total + ")";
}

window.onload = () => {
  if (localStorage.getItem("mok_dark") === "1") { document.body.classList.add("dark"); document.getElementById("dark-mode-btn").textContent = "☀️"; }
  document.getElementById("year-chips").innerHTML = `<button class="chip year-f on" data-year="all">전체 연도</button>` + getYearList().map(y => `<button class="chip year-f" data-year="${y}">${y}</button>`).join("");
  applyFont();

  document.querySelectorAll(".year-f").forEach(btn => btn.onclick = () => {
    const y = btn.dataset.year; if (y === "all") state.years = []; else { if (state.years.includes(y)) state.years = state.years.filter(v => v !== y); else state.years.push(y); }
    syncAllUI(); invalidateList(); render();
  });
  document.querySelectorAll(".subj-f").forEach(btn => btn.onclick = () => { state.subj = btn.dataset.subj; syncAllUI(); invalidateList(); render(); });
  document.querySelectorAll(".chip[data-filter]").forEach(btn => {
    btn.onclick = () => {
      const map = { wrong: "wrongOnly", unsolved: "unsolvedOnly", shuffle: "shuffled", bookmark: "bookmarkOnly" };
      state[map[btn.dataset.filter]] = !state[map[btn.dataset.filter]];
      if (state.shuffled) state.idx = 0;
      syncAllUI(); invalidateList(); render();
    };
  });
  document.getElementById("search-box").oninput = e => { state.search = e.target.value.trim(); invalidateList(); render(); };
  document.querySelectorAll(".mode-tab").forEach(btn => btn.onclick = () => { state.mode = btn.dataset.mode; syncAllUI(); render(); });

  // 스와이프 개선: 가로 80px 이상, 세로 이동보다 가로 이동이 클 때만 작동
  let touchStartX = 0, touchStartY = 0;
  const cArea = document.getElementById("content-area");
  cArea.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, { passive: true });
  cArea.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) { // 가로 이동이 세로 이동의 1.5배보다 클 때만
      if (dx < 0) moveIdx(1); else moveIdx(-1);
    }
  }, { passive: true });

  render(); updateDashboard();
};
</script>
</body>
</html>
